# Rate limit zones for the telemetry endpoint and the panel.
# Installed as /www/server/panel/vhost/nginx/0.kerinciku-limits.conf, which
# nginx includes inside the http block. Kept out of the site's rules because
# the zone directive is only valid at http level. The names carry the site's
# name: other sites on the same nginx have zones of their own.

limit_req_zone $binary_remote_addr zone=kerinciku_beacon:10m rate=60r/m;

# One view of the panel is five requests (the page, its style, its script, the
# game's list of places and the numbers), and nginx counts them before it
# checks the password. The burst in the site's rules is sized for that: eight
# views in a row, then one every ten seconds. Password guesses stay capped at
# this rate.
limit_req_zone $binary_remote_addr zone=kerinciku_panel:10m rate=30r/m;
