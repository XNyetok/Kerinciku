# dev.kerinciku.web.id — the staging site of the new game (game/). aaPanel "URL
# rewrite" rules, installed as /www/server/panel/vhost/rewrite/dev.kerinciku.web.id.conf.
# Source of truth: deploy/nginx/kerinciku-dev-rewrite.conf in this repository.
#
# The panel keeps owning the vhost and the certificate, so its renewal keeps working.
# Pages are served from "current", the symlink that each staging deploy switches
# atomically (.github/workflows/staging.yml, docs/deploy.md).

charset utf-8;

# Security headers for every response. `expires` does not replace them, but an
# add_header inside a location does, so no location below adds a header of its own.
# The policy must stay identical to GAME_CSP in scripts/site.mjs (npm run check compares
# them). It differs from the live site's where the decoders of the 3D files need it:
# 'wasm-unsafe-eval' to compile their WebAssembly, and blob: for their workers and for
# the textures they unpack.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Staging changes with every merge and is not the game players get: keep it out of
# search engines. The build's robots.txt says the same.
add_header X-Robots-Tag "noindex, nofollow" always;

# Pages and version.txt: always revalidate (ETag), so a deploy is visible immediately.
location / {
    root /www/wwwroot/dev.kerinciku.web.id/current;
    try_files $uri $uri/ =404;
    expires -1;
}

# Built files carry a hash of their content in their name, so a name never changes
# meaning: cache them for a year. The prefix match also stops the panel's own regex
# locations for scripts, styles and images, which serve from the site root and not from
# "current", from being consulted at all.
location ^~ /assets/ {
    root /www/wwwroot/dev.kerinciku.web.id/current;
    try_files $uri =404;
    expires 1y;
}

location = /favicon.ico {
    root /www/wwwroot/dev.kerinciku.web.id/current;
    log_not_found off;
    access_log off;
    expires 7d;
}
