# kerinciku.web.id — aaPanel "URL rewrite" rules, installed as
# /www/server/panel/vhost/rewrite/kerinciku.web.id.conf.
# Source of truth: deploy/nginx/kerinciku-rewrite.conf in this repository.
#
# The panel keeps owning the vhost and the certificate, so its renewal keeps working.
# Pages are served from "current", the symlink that each deploy switches atomically.

charset utf-8;

# www → apex. Let's Encrypt checks are answered earlier, by the panel's well-known include.
if ($host = www.kerinciku.web.id) {
    return 301 https://kerinciku.web.id$request_uri;
}

# Security headers for every response. `expires` does not replace them, but an
# add_header inside a location does, so no location below adds a header of its own.
# The policy must stay identical to scripts/situs.mjs (npm run check compares them).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Pages: always revalidate (ETag), so a deploy is visible immediately.
location / {
    root /www/wwwroot/kerinciku.web.id/current;
    try_files $uri $uri/ =404;
    expires -1;
}

# The service worker decides what installed phones run. Never cache it: a phone
# that keeps an old copy keeps serving the old game.
location = /sw.js {
    root /www/wwwroot/kerinciku.web.id/current;
    try_files $uri =404;
    expires -1;
}

# Scripts and styles have stable names, so they revalidate too. The panel's own
# regex for *.js and *.css serves from the site root, not from "current": these
# prefix matches stop it from being consulted at all.
location ^~ /js/ {
    root /www/wwwroot/kerinciku.web.id/current;
    try_files $uri =404;
    expires -1;
}

location ^~ /css/ {
    root /www/wwwroot/kerinciku.web.id/current;
    try_files $uri =404;
    expires -1;
}

# Telemetry collector (server/, docs/telemetry.md). The service listens on
# localhost only, so nginx is the only way in: it caps the body and rate limits
# before anything is stored. The beacon has to stay public, because the game
# posts without credentials. The visitor's address is handed over for the
# province lookup and is not written to any log here.
location = /api/beacon {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    client_max_body_size 2k;
    limit_req zone=kerinciku_beacon burst=30 nodelay;
    limit_req_status 429;
    access_log off;
}

# Everything else under /api/ stays on the server, including the health check:
# the deploy reaches it on 127.0.0.1, so it never needs to be public.
location ^~ /api/ {
    return 404;
}

# Reading the numbers is not public.
location = /api/stats {
    auth_basic "Jelajah Kerinci panel";
    auth_basic_user_file /www/server/nginx/conf/.htpasswd-kerinciku;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    limit_req zone=kerinciku_panel burst=40 nodelay;
    limit_req_status 429;
    access_log off;
}

# Read-only panel, behind basic auth. Nothing here writes. The collector sends
# its own no-store and noindex headers.
location = /panel {
    return 301 /panel/;
}

location ^~ /panel/ {
    auth_basic "Jelajah Kerinci panel";
    auth_basic_user_file /www/server/nginx/conf/.htpasswd-kerinciku;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    limit_req zone=kerinciku_panel burst=40 nodelay;
    limit_req_status 429;
    access_log off;
}

# Icons: stable names, so a short cache rather than immutable.
location ^~ /icons/ {
    root /www/wwwroot/kerinciku.web.id/current;
    try_files $uri =404;
    expires 7d;
}

location = /favicon.ico {
    root /www/wwwroot/kerinciku.web.id/current;
    log_not_found off;
    access_log off;
    expires 7d;
}
