name: Laporan masalah
description: Ada yang tidak berjalan sebagaimana mestinya
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Jangan menempelkan rahasia, data pribadi, atau tangkapan layar pribadi di sini.
        Repositori ini publik. Masalah keamanan dikirim ke alamat di SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: Apa yang terjadi
      description: Ceritakan sesederhana mungkin.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Apa yang seharusnya terjadi
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah untuk mengulanginya
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Di bagian mana
      options:
        - Halaman depan atau peta
        - Petik Teh (Kayu Aro)
        - Potret Satwa (Rimba TNKS)
        - Ikuti Irama (Rentak Kudo)
        - Cari Pasangan (Sungai Penuh)
        - Tangkap Ikan (Danau Kerinci)
        - Mendaki Gunung (Gunung Kerinci)
        - Buku Stempel
        - Lainnya
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Perangkat dan browser
      placeholder: HP Android 11, Chrome 130
  - type: input
    id: version
    attributes:
      label: Versi permainan
      description: Tertulis kecil di bawah tombol "Main" pada halaman depan.
      placeholder: v1.0.0
