name: Koreksi isi atau ide
description: Koreksi kata bahasa Kerinci atau fakta, atau usul tempat dan permainan baru
labels: [isi]
body:
  - type: markdown
    attributes:
      value: |
        Koreksi dari orang Kerinci sangat membantu. Jangan menyertakan data pribadi orang
        lain: cukup sebut dusun atau kecamatannya.
  - type: dropdown
    id: kind
    attributes:
      label: Jenis
      options:
        - Koreksi kata bahasa Kerinci
        - Koreksi fakta
        - Usul tempat atau permainan baru
        - Lainnya
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Isi koreksi atau usul
      description: Untuk koreksi, tulis yang sekarang tertulis dan yang seharusnya.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Sumber
      description: Dusun atau kecamatan asal kata itu, atau buku dan situs yang memuat faktanya.
      placeholder: Dialek Sungai Penuh
