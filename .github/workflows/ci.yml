name: CI

# Every push and pull request is checked. Nothing here deploys: production
# changes only when a release is published (release.yml, then deploy.yml;
# docs/deploy.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks on a tag, and builds it with the tag's version.
  workflow_call:
    inputs:
      version:
        description: Release version from the tag, for example 0.4.0
        type: string
        required: true

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (verified checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan the full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --config .gitleaks.toml .'

  hygiene:
    name: Check tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # File names, sizes, personal data (home folders, e-mail addresses, server
      # addresses) in every tracked file, and the identity on every commit.
      - name: Reject private files and personal data
        run: scripts/check-privacy.sh --tracked

      - name: Reject personal data in the history
        run: scripts/check-privacy.sh --history

      - name: Check the nginx config
        run: |
          set -euo pipefail
          # The files are includes, so wrap them the way the panel does: the rules
          # inside the site's server block, the rate limit zones at http level.
          mkdir -p "$RUNNER_TEMP/nginx"
          cat > "$RUNNER_TEMP/nginx/nginx.conf" <<'EOF'
          events {}
          http {
            server {
              listen 8080;
              server_name kerinciku.web.id www.kerinciku.web.id;
              include /repo/deploy/nginx/kerinciku-rewrite.conf;
            }
            include /repo/deploy/nginx/kerinciku-limits.conf;
          }
          EOF
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311 \
            nginx -t

      - name: Lint the shell scripts
        run: shellcheck deploy/*.sh .githooks/pre-commit scripts/*.sh

  build:
    name: Check & build
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the page, the places and the policy
        run: npm run check

      - name: Test the game clock, the build, the collector and the deploy script
        run: npm test

      - name: Name the build
        id: label
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          # The version comes from the release tag; every other build is a "-dev"
          # build of whatever package.json says.
          if [ -n "$RELEASE_VERSION" ]; then
            label="${RELEASE_VERSION}+${sha}"
          else
            label="$(node -p "require('./package.json').version")-dev+${sha}"
          fi
          echo "label=$label" >>"$GITHUB_OUTPUT"
          echo "Build label: $label"

      - name: Build
        env:
          BUILD_LABEL: ${{ steps.label.outputs.label }}
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

      # The telemetry collector is published as it is in the repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector
          path: server/
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser smoke tests
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Play every game in a browser
        run: npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
