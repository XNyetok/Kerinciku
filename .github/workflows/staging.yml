name: Staging

# Builds the new game (game/) and puts it on the staging site,
# https://dev.kerinciku.web.id, so it can be tried on real phones over a real
# connection. Players never get it from here: the live game changes only when a
# release is published (release.yml, then deploy.yml).
#
# A merge to main that touches the new game deploys it. To try a branch before
# it is merged:
#
#   gh workflow run staging.yml --ref <branch>
#
# The build runs without any secret. Only the deploy job, which runs no code from
# npm, holds the deploy key. See docs/deploy.md, Staging.
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/site.mjs'
      - 'deploy/remote.sh'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    name: Build the new game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Name the build
        id: label
        run: |
          set -euo pipefail
          label="$(node -p "require('./package.json').version")-dev+$(git rev-parse --short=7 HEAD)"
          echo "label=$label" >>"$GITHUB_OUTPUT"
          echo "Build label: $label"

      - name: Type check and build
        env:
          BUILD_LABEL: ${{ steps.label.outputs.label }}
        run: npm run game:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-site
          path: game/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to staging
    needs: build
    # STAGING_ENABLED=true once the staging site exists on the server (docs/deploy.md).
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://dev.kerinciku.web.id
    env:
      SITE: https://dev.kerinciku.web.id
      LABEL: ${{ needs.build.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
          path: repo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: game-site
          path: dist

      - name: Check the build
        run: |
          set -euo pipefail
          [ -f dist/index.html ] || { echo "::error::the build has no index.html"; exit 1; }
          grep -qxF "$LABEL" dist/version.txt || { echo "::error::the build is not $LABEL"; exit 1; }

      - name: Check deploy settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          # A variable missing from GitHub arrives as an empty string, and an empty
          # path would point rsync and the cleanup at the wrong directory.
          failed=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT STAGING_PATH; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; failed=1; fi
          done
          [ "$HAS_SSH_KEY" = "true" ] || { echo "::error::secret DEPLOY_SSH_KEY is not set"; failed=1; }
          [ "$HAS_KNOWN_HOSTS" = "true" ] || { echo "::error::secret DEPLOY_KNOWN_HOSTS is not set"; failed=1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "::error::DEPLOY_PORT must be a number"; failed=1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::DEPLOY_USER has unexpected characters"; failed=1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::DEPLOY_HOST has unexpected characters"; failed=1; }
          # Absolute, at least two levels deep, no "..", no spaces or shell characters,
          # and the staging site's own folder: never the live site's.
          [[ "$STAGING_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] && [[ "$STAGING_PATH" != *..* ]] \
            || { echo "::error::STAGING_PATH must be an absolute path like /www/wwwroot/site"; failed=1; }
          [[ "$STAGING_PATH" == */dev.kerinciku.web.id ]] \
            || { echo "::error::STAGING_PATH must be the root of dev.kerinciku.web.id"; failed=1; }
          [ "$STAGING_PATH" != "$DEPLOY_PATH" ] || { echo "::error::STAGING_PATH is the live site's root"; failed=1; }
          exit "$failed"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host staging
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Name the release
        id: release
        run: |
          set -euo pipefail
          # A fresh folder for every deploy: UTC time, then the commit.
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "name=$release" >>"$GITHUB_OUTPUT"
          echo "Release folder: $release"

      - name: Upload the site
        env:
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: rsync -rlptz --delete --mkpath dist/ "staging:$STAGING_PATH/releases/$RELEASE/"

      - name: Switch the site
        env:
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: ssh staging bash -s -- activate-site "$STAGING_PATH" "$RELEASE" < repo/deploy/remote.sh

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          for path in / /robots.txt; do
            code=$(curl -fsS --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' "${SITE}${path}")
            echo "$code $path"
            [ "$code" = "200" ]
          done

          # What is live must be this build, not just any page.
          live=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/version.txt?smoke=${GITHUB_RUN_ID}")
          [ "$live" = "$LABEL" ] || { echo "::error::the staging site is '$live', not $LABEL"; exit 1; }
          echo "live: $live"

          # Every script and style the page loads answers 200.
          page=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/")
          while IFS= read -r path; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "${SITE}${path}")
            echo "$code $path"
            [ "$code" = "200" ]
          done < <(grep -oE '/assets/[A-Za-z0-9._-]+' <<<"$page" | sort -u)

          # The headers come from the server config, not from the build.
          headers=$(curl -fsSI "${SITE}/")
          grep -qi "^content-security-policy:.*'unsafe-eval'" <<<"$headers" \
            || { echo "::error::staging does not send the new game's Content-Security-Policy; install deploy/nginx/kerinciku-dev-rewrite.conf (docs/deploy.md)"; exit 1; }
          grep -qi '^x-robots-tag:.*noindex' <<<"$headers" \
            || { echo "::error::staging does not send X-Robots-Tag: noindex"; exit 1; }

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          STAGING_PATH: ${{ vars.STAGING_PATH }}
        run: |
          set -euo pipefail
          echo "::error::the smoke test failed, going back to the previous build"
          ssh staging bash -s -- rollback-site "$STAGING_PATH" < repo/deploy/remote.sh
