name: Deploy

# Ships a published release to production: publishing the draft that
# release.yml made starts this. To deploy a release again, or roll back to an
# older one, run it by hand on that release's tag:
#
#   gh workflow run deploy.yml --ref v0.3.1
#
# See docs/deploy.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    # DEPLOY_ENABLED=false pauses deploying. The environment only accepts v*.*.* tags.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://kerinciku.web.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE: https://kerinciku.web.id
      # The published release, or the tag a run by hand was started on.
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$TAG' is not a release tag; run this workflow on a tag like v1.2.3"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: deploy
          path: repo

      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Deploy exactly the files the draft was reviewed with, never a fresh build.
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = "false" ] || { echo "::error::$TAG is still a draft; publish it first"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'kerinciku-site-*.tar.gz' --pattern SHA256SUMS \
            || { echo "::error::$TAG has no site file"; exit 1; }
          (cd release && sha256sum --check --strict SHA256SUMS)
          mkdir dist
          tar -xzf release/kerinciku-site-*.tar.gz -C dist
          # The archive must be the site, built for this tag, and nothing else.
          for file in index.html sw.js js/versi.js; do
            [ -f "dist/$file" ] || { echo "::error::the site file has no $file"; exit 1; }
          done
          grep -qF "JK.versi = \"${TAG#v}+" dist/js/versi.js \
            || { echo "::error::the site file was not built for $TAG"; exit 1; }

      - name: Check deploy settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          # A variable missing from GitHub arrives as an empty string, and an empty
          # path would point rsync and the cleanup at the wrong directory.
          failed=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; failed=1; fi
          done
          [ "$HAS_SSH_KEY" = "true" ] || { echo "::error::secret DEPLOY_SSH_KEY is not set"; failed=1; }
          [ "$HAS_KNOWN_HOSTS" = "true" ] || { echo "::error::secret DEPLOY_KNOWN_HOSTS is not set"; failed=1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "::error::DEPLOY_PORT must be a number"; failed=1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::DEPLOY_USER has unexpected characters"; failed=1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::DEPLOY_HOST has unexpected characters"; failed=1; }
          # Absolute, at least two levels deep, no "..", no spaces or shell characters.
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] && [[ "$DEPLOY_PATH" != *..* ]] \
            || { echo "::error::DEPLOY_PATH must be an absolute path like /www/wwwroot/site"; failed=1; }
          exit "$failed"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One place for the connection settings, so every step uses the same ones.
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Name the release
        id: release
        run: |
          set -euo pipefail
          # A fresh folder for every deploy, even of the same tag: UTC time, then the commit.
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "name=$release" >>"$GITHUB_OUTPUT"
          echo "Release folder: $release"

      - name: Upload the site
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          # A fresh folder: what is live is untouched while this runs.
          rsync -rlptz --delete --mkpath dist/ "production:$DEPLOY_PATH/releases/$RELEASE/"

      - name: Switch the site
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          # Checks the upload, then points "current" at it. See deploy/remote.sh.
          ssh production bash -s -- activate "$DEPLOY_PATH" "$RELEASE" < repo/deploy/remote.sh

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          for path in / /sw.js /js/main.js /css/style.css /manifest.webmanifest /icons/icon-192.png; do
            code=$(curl -fsS --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' "${SITE}${path}")
            echo "$code $path"
            [ "$code" = "200" ]
          done

          # What is live must be this release, not just any page: the version file
          # and the service worker both carry the build label.
          label=$(grep -oE 'JK\.versi = "[^"]+"' dist/js/versi.js)
          live=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/js/versi.js?smoke=${GITHUB_RUN_ID}")
          grep -qF "$label" <<<"$live" || { echo "::error::the live site is not $label"; exit 1; }
          worker=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/sw.js?smoke=${GITHUB_RUN_ID}")
          grep -qF "var VERSI = \"${label#JK.versi = \"}" <<<"$worker" \
            || { echo "::error::the live service worker is not this release"; exit 1; }
          echo "live: $label"

          # The security headers come from the server config, not from the release.
          headers=$(curl -fsSI "${SITE}/")
          grep -qi '^content-security-policy:' <<<"$headers" \
            || { echo "::error::the live site sends no Content-Security-Policy; install deploy/nginx (docs/deploy.md)"; exit 1; }

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "::error::the smoke test failed, going back to the previous release"
          ssh production bash -s -- rollback "$DEPLOY_PATH" < repo/deploy/remote.sh
