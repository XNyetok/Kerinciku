<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c5c6c4">
<title>Jelajah Kerinci (versi uji)</title>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div id="stage" class="stage"></div>
<pre id="hud" class="hud" hidden></pre>
<div id="buttons" class="buttons" hidden>
  <button type="button" id="b-bench"></button>
  <button type="button" id="b-full"></button>
  <button type="button" id="b-hud"></button>
</div>
<p id="notice" class="notice" hidden></p>
<p id="message" class="message"></p>
<section id="results" class="results" hidden>
  <pre id="results-text"></pre>
  <textarea id="results-json" readonly rows="6"></textarea>
  <p id="results-note"></p>
  <div class="results-buttons">
    <button type="button" id="b-copy"></button>
    <button type="button" id="b-close"></button>
  </div>
</section>
<p id="label" class="label"></p>
<noscript><p>Halaman ini butuh JavaScript.</p></noscript>
</body>
</html>
